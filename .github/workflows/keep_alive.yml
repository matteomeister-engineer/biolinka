name: Keep Biolinka Awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit app with timestamp
        run: |
          echo "=== Waking Biolinka Streamlit App ==="
          echo "Timestamp: $(date)"
          
          # List of endpoints to ping (add more if needed)
          ENDPOINTS=(
            "https://biolinka.streamlit.app/"
          )

          for url in "${ENDPOINTS[@]}"; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "Pinged $url -> HTTP response code: $HTTP_STATUS"
          done

          echo "=== Finished pinging ==="