name: Keep Biolinka Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive ping (no redirect loop)
        run: |
          set +e
          URL="https://biolinka.streamlit.app/_stcore/health"

          for i in 1 2 3; do
            echo "Attempt $i..."
            curl -sS -o /dev/null -w "HTTP=%{http_code}\n" --max-redirs 5 --connect-timeout 10 --max-time 20 "$URL"
            sleep 10
          done

          exit 0