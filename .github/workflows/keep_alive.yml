name: Keep Biolinka Awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit app (no redirects)
        run: |
          set +e
          curl -sS --max-redirs 0 -o /dev/null -w "HTTP=%{http_code}\n" https://biolinka.streamlit.app/
          exit 0